name: flutter_map_tile_caching
description: Plugin for 'flutter_map' providing advanced caching functionality,
  with ability to download map regions for offline use.
version: 6.2.0+22
repository: https://github.com/JaffaKetchup/flutter_map_tile_caching
issue_tracker: https://github.com/JaffaKetchup/flutter_map_tile_caching/issues
documentation: https://fmtc.jaffaketchup.dev
publish_to: none

funding:
  - https://github.com/sponsors/JaffaKetchup

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.2.0
  bezier: ^1.2.0
  collection: ^1.19.1
  cross_file: ^0.3.5
  file_picker: ^12.1.1
  flutter:
    sdk: flutter
  flutter_background: ^1.3.1
  flutter_local_notifications: ^22.3.0
  flutter_map:
    git:
      url: https://github.com/robpot95/flutter_map.git
      ref: main
  http: ^1.6.0
  ini: ^2.1.0
  latlong2: ^0.10.1
  meta: ^1.19.0
  move_to_background: ^1.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: 12.0.3
  queue: ^3.4.0
  share_plus: ^13.3.0
  stream_transform: ^2.1.1
  vector_math: ^2.4.2
  watcher: ^1.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter: null
